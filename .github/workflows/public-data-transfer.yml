name: public-data-transfer
on:
  push:
    branches:
      - chatgpt-public-data-transfer-20260829
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download public source archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_data
          CEPII_URL="https://www.cepii.fr/DATA_DOWNLOAD/gravity/data/Gravity_csv_V202211.zip"
          BIS_URL="https://data.bis.org/static/bulk/WS_LBS_D_PUB_csv_flat.zip"
          curl -fL --retry 6 --retry-delay 5 --connect-timeout 30 -A "Mozilla/5.0" "$CEPII_URL" -o public_data/Gravity_csv_V202211.zip
          curl -fL --retry 6 --retry-delay 5 --connect-timeout 30 -A "Mozilla/5.0" "$BIS_URL" -o public_data/WS_LBS_D_PUB_csv_flat.zip

          DOI="doi:10.7910/DVN/LEJUQZ"
          curl -fL --retry 6 -A "Mozilla/5.0" "https://dataverse.harvard.edu/api/datasets/:persistentId/?persistentId=$DOI" -o public_data/harvard_dataverse_metadata.json
          # Official Harvard Dataverse files. Curl is used because urllib can be blocked by Dataverse anti-bot rules.
          curl -fL --retry 6 -A "Mozilla/5.0" "https://dataverse.harvard.edu/api/access/datafile/13642051" -o public_data/IdealPointDyads1946-2025.tab || true
          curl -fL --retry 6 -A "Mozilla/5.0" "https://dataverse.harvard.edu/api/access/datafile/13642024" -o public_data/Codebook_IdealPointEstimates1946-2025.txt || true
          curl -fL --retry 6 -A "Mozilla/5.0" "https://dataverse.harvard.edu/api/access/datafile/11824371" -o public_data/IdealpointsJuly2025.tab || true

          # Public GitHub mirror fallback for the updated country-year ideal points.
          if [ ! -s public_data/IdealpointsJuly2025.tab ]; then
            curl -fL --retry 6 -A "Mozilla/5.0" "https://media.githubusercontent.com/media/ayushman1712/NS-Project/main/dataverse_files/Idealpointestimates1946-2025.csv" -o public_data/Idealpointestimates1946-2025.csv
          fi

          cat > public_data/SOURCES.txt <<'EOF'
          CEPII Gravity V202211:
          https://www.cepii.fr/DATA_DOWNLOAD/gravity/data/Gravity_csv_V202211.zip
          BIS Locational Banking Statistics, public flat CSV:
          https://data.bis.org/static/bulk/WS_LBS_D_PUB_csv_flat.zip
          Harvard Dataverse, Erik Voeten, United Nations General Assembly Ideal Points:
          doi:10.7910/DVN/LEJUQZ
          Public mirror fallback:
          https://github.com/ayushman1712/NS-Project
          EOF
          (cd public_data && sha256sum * > SHA256SUMS.txt)
          du -h public_data/*
          unzip -l public_data/Gravity_csv_V202211.zip | head -30 || true
          unzip -l public_data/WS_LBS_D_PUB_csv_flat.zip | head -30 || true
      - name: Upload CEPII source
        uses: actions/upload-artifact@v4
        with:
          name: cepii-source
          path: |
            public_data/Gravity_csv_V202211.zip
            public_data/SOURCES.txt
            public_data/SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
      - name: Upload BIS source
        uses: actions/upload-artifact@v4
        with:
          name: bis-source
          path: |
            public_data/WS_LBS_D_PUB_csv_flat.zip
            public_data/SOURCES.txt
            public_data/SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
      - name: Upload UN ideal-points source
        uses: actions/upload-artifact@v4
        with:
          name: idealpoints-source
          path: |
            public_data/harvard_dataverse_metadata.json
            public_data/*Ideal*
            public_data/*ideal*
            public_data/*Codebook*
            public_data/*codebook*
            public_data/SOURCES.txt
            public_data/SHA256SUMS.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1
